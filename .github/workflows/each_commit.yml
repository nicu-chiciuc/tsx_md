name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm --package=vite-plus@0.1.18 dlx vp install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm exec vp run --filter @aaa/ui build
      - run: pnpm exec vp run --filter tsx_md tsc:ci
      - run: pnpm exec vp run --filter tsx_md build
      - run: pnpm exec vp run --filter gif_md build
      - run: pnpm exec vp run --filter validate_form build
