name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.1

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit registry signatures
        run: pnpm audit signatures
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Audit development dependencies
        run: pnpm audit --dev
      - name: Install trusted dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm exec vp run --filter @aaa/ui build
      - run: pnpm exec vp run --filter tsx_md tsc:ci
      - run: pnpm exec vp run --filter tsx_md build
      - run: pnpm exec vp run --filter gif_md build
      - run: pnpm exec vp run --filter validate_form build
